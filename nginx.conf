server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para carga ultrarrápida en redes móviles (NFC)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/vcard
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Soporte de tipo MIME estándar para descargas de contacto vCard (.vcf)
    location ~* \.vcf$ {
        root /usr/share/nginx/html;
        default_type "text/vcard; charset=utf-8";
        add_header Content-Type "text/vcard; charset=utf-8";
        add_header Content-Disposition 'attachment; filename="ivan-olivera.vcf"';
        add_header Cache-Control "no-cache";
    }

    # Optimización de Caché para Assets Estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
